# Template — do not add user-specific paths or values.
# Consumed by the 86Box backend at launch time and merged with runtime values.
#
# IMPORTANT: All hardware identifiers below must match exactly what your installed
# version of 86Box accepts. Identifiers vary between 86Box releases.
# Reference: https://86box.net
#
# Leave no field empty — the backend will reject blank values at launch.

Machine:
  machine: p55t2p4        # verify against your 86Box version
  cpu_family: Intel Pentium (P54C)  # verify against your 86Box version
  cpu_speed: 133
  mem_size: 32768         # kilobytes

Video:
  gfxcard: S3 ViRGE/DX   # verify against your 86Box version

Sound:
  sndcard: Sound Blaster 16  # verify against your 86Box version
