# Template — do not add user-specific paths or values.
# Consumed by the 86Box backend at launch time and merged with runtime values.
# Supported eras: win95, win98, winxp (see docs/EMULATORS.md).
#
# Machine, cpu_family, cpu_speed, mem_size, gfxcard, and sndcard values are
# era-specific. They must be set from the 86Box machine list for the target era.
# No machine names are hardcoded here because they are not documented in
# config/emulators/86box.toml or docs/EMULATORS.md.

[General]
vid_resize = 0
vid_resize_monitor = 0
scale_factor = 1
scale_mode = 0
start_in_fullscreen = 0
video_fullscreen_first = 1
mouse_capture = 1
mouse_sensitivity = 1.000000
enable_discord_rpc = 0

[Machine]
# machine   = set per era — win95: 486/socket7, win98: socket7/slot1, winxp: socket370/slot1
# cpu_family = set per machine
# cpu_speed  = set per machine
# mem_size   = 32768 (win95), 65536 (win98), 131072 (winxp) — in KB

[Video]
# gfxcard = set per era — a card supported by the target OS and ROM pack

[Sound]
# sndcard     = set per era
midi_device = none
midi_out_device = none

[Network]
net_card = none

[Ports and devices]
serial1_enabled = 1
serial2_enabled = 1
serial3_enabled = 0
serial4_enabled = 0
lpt1_enabled = 1
lpt2_enabled = 0
lpt3_enabled = 0
game_enabled = 1

[Other removable devices]
zip_a_type = 0
zip_b_type = 0
mo_a_type = 0
mo_b_type = 0

[Floppy and CD/DVD drives]
fda_type = 3
fda_fn =
fdb_type = 0
fdb_fn =
cdrom_speed = 8

[Hard disks]
# Populated at launch time — do not set here.
