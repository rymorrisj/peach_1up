# Peach 1UP Era Configuration
# Era to backend mapping and defaults

cpu_min_rate_percent: 5

dos:
  backend: dosbox-x
  memory_limit_mb: 512
  cpu_limit_percent: 50
  supported_media: [".iso", ".img", ".cue", ".exe", ".bat", ".com"]
  mount_type: hdd
  # Size of the shared DOS environment C: drive (library/system/os/dos/dos.img).
  # Must fall within the FAT16 range enforced by format_fat16 (10–1024 MB).
  default_disk_size_mb: 512

win95:
  memory_limit_mb: 2048
  cpu_limit_percent: 75
  supported_media: [".iso", ".img", ".cue"]
  mount_type: cdrom
  default_disk_size_mb: 1024
  dgvoodoo2_supported: true

win98:
  memory_limit_mb: 2048
  cpu_limit_percent: 75
  supported_media: [".iso", ".img", ".cue"]
  mount_type: cdrom
  default_disk_size_mb: 2048
  dgvoodoo2_supported: true

winxp:
  memory_limit_mb: 3072
  cpu_limit_percent: 80
  supported_media: [".iso", ".img", ".cue"]
  mount_type: cdrom
  default_disk_size_mb: 4096
  dgvoodoo2_supported: true

ps1:
  backend: duckstation
  memory_limit_mb: 1024
  cpu_limit_percent: 60
  supported_media: [".iso", ".bin", ".cue", ".chd"]

ps2:
  backend: pcsx2
  memory_limit_mb: 4096
  cpu_limit_percent: 80
  supported_media: [".iso", ".bin", ".cue", ".chd"]

ps3:
  backend: rpcs3
  memory_limit_mb: 12288
  cpu_limit_percent: 90
  supported_media: [".iso", ".pkg"]

xbox:
  backend: xemu
  memory_limit_mb: 3072
  cpu_limit_percent: 75
  supported_media: [".iso", ".xiso"]

xbox360:
  backend: xenia
  memory_limit_mb: 6144
  cpu_limit_percent: 75
  supported_media: [".iso", ".xex"]

nes:
  backend: mesen
  memory_limit_mb: 512
  cpu_limit_percent: 30
  supported_media: [".nes", ".chd"]

snes:
  backend: mesen
  memory_limit_mb: 768
  cpu_limit_percent: 50
  # .fig/.swc are legitimate SNES ROM header variants Mesen already opens
  # (config/emulators/mesen.toml's supported_formats already listed them);
  # added here so eras.yaml, the single enforced source for launch-time
  # format validation, doesn't reject a file mesen.toml always claimed to
  # support.
  supported_media: [".sfc", ".smc", ".zip", ".fig", ".swc"]
  mount_type: rom

n64:
  backend: project64
  memory_limit_mb: 1024
  cpu_limit_percent: 60
  supported_media: [".z64", ".n64", ".v64"]

dreamcast:
  backend: flycast
  memory_limit_mb: 1024
  cpu_limit_percent: 60
  supported_media: [".gdi", ".cdi", ".chd", ".cue"]
