# Peach 1UP Era Configuration
# Era to backend mapping and defaults

dos:
  backend: dosbox
  memory_limit_mb: 512
  cpu_limit_percent: 50
  supported_media: [".iso", ".img", ".cue"]
  mount_type: hdd

win31:
  backend: dosbox
  memory_limit_mb: 512
  cpu_limit_percent: 50
  supported_media: [".iso", ".img", ".cue"]
  mount_type: hdd

win95:
  primary: box86
  secondary: virtualbox
  compat: dosbox
  memory_limit_mb: 512
  cpu_limit_percent: 75
  supported_media: [".iso", ".img", ".cue"]
  mount_type: cdrom
  default_disk_size_mb: 1024

win98:
  primary: box86
  secondary: virtualbox
  compat: dosbox
  memory_limit_mb: 512
  cpu_limit_percent: 75
  supported_media: [".iso", ".img", ".cue"]
  mount_type: cdrom
  default_disk_size_mb: 2048

winxp:
  primary: virtualbox
  memory_limit_mb: 1024
  cpu_limit_percent: 80
  supported_media: [".iso", ".img", ".cue"]
  mount_type: cdrom
  default_disk_size_mb: 4096

ps1:
  backend: duckstation
  memory_limit_mb: 512
  cpu_limit_percent: 60
  supported_media: [".iso", ".bin", ".cue", ".chd"]

ps2:
  backend: pcsx2
  memory_limit_mb: 512
  cpu_limit_percent: 80
  supported_media: [".iso", ".bin", ".cue", ".chd"]

xbox:
  backend: xemu
  memory_limit_mb: 1024
  cpu_limit_percent: 75
  supported_media: [".iso", ".xiso"]

nes:
  backend: mesen
  memory_limit_mb: 128
  cpu_limit_percent: 30
  supported_media: [".nes", ".chd"]

n64:
  backend: project64
  memory_limit_mb: 512
  cpu_limit_percent: 60
  supported_media: [".z64", ".n64", ".v64"]
