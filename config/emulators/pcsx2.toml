slug = "pcsx2"
era = "ps2"
display_name = "PCSX2"
name = "PCSX2"
version = "2.7.387.0"
binary = "pcsx2-qt.exe"
download_url = "https://pcsx2.net"
release_url = "https://github.com/PCSX2/pcsx2/releases"
portable_sentinel = "portable.txt"
cli_args_prefix = ["-nogui", "-batch"]
sandbox_mode = "appcontainer"
container_enabled = true
skip_memory_limit = true
skip_cpu_limit = true
capabilities = []
description = "PlayStation 2 emulation"
required = false
install_type = "github_release"
install_scope = "portable"
# The Windows Qt build is published as a .7z. Anchored so the -symbols archive,
# the installer .exe, and the non-Windows assets cannot produce an ambiguous
# match. Confirmed against pcsx2-v2.6.3-windows-x64-Qt.7z (26.8 MB compressed,
# roughly 140 MB extracted, within the installer's 500 MB extraction cap).
asset_pattern = '^pcsx2-v[\d.]+-windows-x64-Qt\.7z$'
license = "GPL-3.0"
copyright = "Copyright 2002–2024 PCSX2 Dev Team"
source_url = "https://github.com/PCSX2/pcsx2"
supported_formats = [".iso", ".bin", ".cue", ".chd"]
guidance_text = "PCSX2 is not included with Peach 1UP. Click Install to download the current Windows release from github.com/PCSX2/pcsx2 into emulators/pcsx2/."
guidance_url = "https://pcsx2.net"

[[container_broker_files]]
path_key = "install_dir"
access = "r"
mode = "grant"


[[container_broker_files]]
path_key = "memcards_dir"
access = "rw"
mode = "grant"

[[container_broker_files]]
path_key = "snaps_dir"
access = "rw"
mode = "grant"

[[container_broker_files]]
path_key = "cache_dir"
access = "rw"
mode = "grant"

[[container_broker_files]]
path_key = "inis_dir"
access = "rw"
mode = "grant"

[[container_broker_files]]
path_key = "savestates_dir"
access = "rw"
mode = "grant"

[[dependencies]]
name = "ps2-bios"
acquire_method = "user_supplied"
required = true
validation_type = "directory"
display_name = "PS2 BIOS"
platform = "ps2"
bios_path = "emulators/pcsx2/bios"
guidance_text = "Place your PS2 BIOS files in emulators/pcsx2/bios/. The full multi-file set is required — do not rename any files."
guidance_url = "https://pcsx2.net/guides/basic-setup/"

[[known_limitations]]
title = "PS2 BIOS requires the full file set"
severity = "warning"
description = "The PS2 BIOS is a multi-file set. All files must be present with their original filenames — renaming or partial sets will fail to load."
