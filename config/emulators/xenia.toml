[[known_limitations]]
title = "Default GPU backend (D3D12) can crash on AMD hardware"
severity = "warning"
description = "Xenia defaults to gpu = \"any\", which resolves to D3D12 and has been confirmed to trigger an AMD GPU driver timeout during gameplay. Switching to gpu = \"vulkan\" avoids the crash, but Xenia's own in-app warning states its Vulkan FBO render path is 'heavily incomplete, early development.' There is no clean default, pick vulkan if D3D12 crashes are hit, or any/d3d12 for otherwise wider compatibility. Change it by editing the gpu key in Xenia's portable xenia.config.toml (or in-app under Settings) and restarting."
