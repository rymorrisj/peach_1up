slug = "xemu"
era = "xbox"
display_name = "xemu"
name = "xemu"
version = "0.8.134"
binary = "xemu.exe"
sha256 = ""
download_url = "https://xemu.app"
release_url = "https://github.com/xemu-project/xemu/releases"
portable_sentinel = "xemu.toml"
sandbox_mode = "appcontainer"
container_enabled = false
container_hardcap_disabled = true
container_permanently_excluded = true
capabilities = []
skip_memory_limit = true
description = "Original Xbox emulation"
required = false
install_type = "github_release"
install_scope = "portable"
asset_pattern = '^xemu-[\d.]+-windows-x86_64\.zip$'
license = "GPL-2.0"
copyright = "Copyright 2020–2024 Matt Borgerson and contributors"
source_url = "https://github.com/xemu-project/xemu"
supported_formats = [".iso", ".xiso"]
guidance_text = "Download the xemu Windows release and extract it to emulators/xemu/ so that xemu.exe is inside."
guidance_url = "https://xemu.app"

[[container_broker_files]]
path_key = "install_dir"
access = "rw"
mode = "grant"

[[container_broker_files]]
path_key = "hdd_image"
access = "rw"
mode = "inherit"

[[container_broker_files]]
path_key = "appdata_xemu"
access = "rw"
mode = "grant"

[[dependencies]]
name = "xbox-bios"
acquire_method = "user_supplied"
required = true
validation_type = "directory"
display_name = "Xbox BIOS"
platform = "xbox"
bios_path = "emulators/xemu/data/default"
required_files = ["mcpx_1.0.bin", "xbox_hdd.qcow2"]
required_glob = "*.bin"
required_glob_excludes = ["mcpx_1.0.bin", "eeprom.bin"]
guidance_text = "Place your Xbox BIOS .bin files (mcpx_1.0.bin and the appropriate ROM) in emulators/xemu/data/default/. xemu will not start without them."
guidance_url = "https://xemu.app/docs/required-files/"

[[dependencies]]
name = "xbox-hdd"
acquire_method = "user_supplied"
required = true
validation_type = "file"
display_name = "Xbox HDD image"
platform = "xbox"
guidance_text = "Place xbox_hdd.qcow2 in emulators/xemu/data/default/. A pre-built blank image is available from the xemu project."
guidance_url = "https://xemu.app/docs/required-files/"

[[known_limitations]]
title = "Memory limit must be disabled"
severity = "warning"
description = "xemu pre-allocates a 1 GB JIT buffer at startup. The Job Object memory cap must be disabled (skip_memory_limit = true) or set above 2048 MB — otherwise xemu exits immediately with a paging file error."

[[known_limitations]]
title = "Shader cache writes to AppData"
severity = "info"
description = "xemu writes its shader cache to %APPDATA%\\xemu\\ regardless of portable mode. This is a known xemu limitation and cannot be overridden via config."

[[known_limitations]]
title = "AppContainer isolation not supported"
severity = "critical"
description = "xemu is built on QEMU's TCG emulation backend, which requires DeviceIoControl access to query disk geometry for qcow2 images. AppContainer blocks this call, causing a fatal block driver assertion at launch. Job Object isolation (kill-on-close, CPU cap) is the only available isolation layer on Windows. This is a QEMU platform limitation, not a configuration issue. See https://www.qemu.org/docs/master/system/security.html for details."

[[known_limitations]]
title = "Disc images must be in XISO format"
severity = "critical"
description = "xemu requires disc images in XISO format. Standard ISO rips will mount but show 'add disk' because they contain the raw Xbox disc layout including unreadable partitions. Convert using extract-xiso before adding to your library. See https://xemu.app/docs/disc-images/ for instructions."