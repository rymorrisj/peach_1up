[[known_limitations]]
title = "AppContainer is permanently excluded"
severity = "warning"
description = "Under AppContainer, Project64 shows an error dialog (\"Exception caught, File: main.cpp, Line: 99\") and exits with code 1. The root cause is unknown. It runs under Job Object isolation only, and AppContainer cannot be turned on for it. If you see that dialog, check that AppContainer is off for Project64 on its Overview tab."

[[known_limitations]]
title = "First-run Support prompt"
severity = "info"
description = "Project64 shows a \"Support Project64\" prompt with a Continue button after a short wait. Before launching from Peach 1UP for the first time, start Project64 once from its own folder and click Continue. A launch from the command line before the prompt was cleared failed once on a fresh install; whether the two are linked is unconfirmed."
