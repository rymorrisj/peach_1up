slug = "project64"
era = "n64"
display_name = "Project64"
name = "Project64"
version = "3.0.1"
binary = "Project64.exe"
download_url = "https://www.pj64-emu.com"
release_url = "https://github.com/project64/project64/releases"
portable_sentinel = ""
cli_args_prefix = []
sandbox_mode = "appcontainer"
container_enabled = true
skip_memory_limit = true
skip_cpu_limit = true
capabilities = []
description = "Nintendo 64 emulation"
required = false
# NOT github_release: project64/project64 publishes git tags but has no
# published GitHub releases at all (the /releases API returns an empty list and
# /releases/latest returns 404), so there is no release asset to match. Windows
# builds ship only from pj64-emu.com. Until a release-hosting source exists this
# stays a user-supplied drop-in, which at least fails with an actionable error
# instead of the previous "bundled" no-op.
install_type = "zip"
install_scope = "portable"
windows_installer_glob = ""
known_path = ""
license = "GPL-2.0"
copyright = "Copyright 2001–2024 Project64 Ltd and contributors"
source_url = "https://github.com/project64/project64"
supported_formats = [".z64", ".n64", ".v64"]
guidance_text = "Project64 is not included with Peach 1UP and cannot be downloaded automatically, because the project publishes no GitHub release assets. Download the Windows build from pj64-emu.com and extract it into emulators/project64/ so that Project64.exe is inside."
guidance_url = "https://www.pj64-emu.com"

[[container_broker_files]]
path_key = "install_dir"
access = "r"
mode = "grant"


[[container_broker_files]]
path_key = "pj64_save_dir"
access = "rw"
mode = "grant"

[[container_broker_files]]
path_key = "plugin_dir"
access = "r"
mode = "grant"

[[container_broker_files]]
path_key = "pj64_config_dir"
access = "rw"
mode = "grant"
