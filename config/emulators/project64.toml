[[known_limitations]]
title = "Crashes under AppContainer when memory limit is enabled"
severity = "moderate"
description = "Project64 crashes on launch (Main.cpp:99, exit_code=1) specifically when a Job Object memory limit is enforced alongside AppContainer. Root cause unknown. Workaround is to run with the memory limit disabled (skip_memory_limit = true); the CPU limit and AppContainer isolation itself are unaffected."
