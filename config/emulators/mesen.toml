slug = "mesen"
era = "nes"
supported_eras = ["nes", "snes"]
display_name = "Mesen"
name = "Mesen"
version = "2.1.1"
binary = "Mesen.exe"
download_url = "https://www.mesen.ca"
portable_sentinel = ""
cli_args_prefix = []
container_enabled = true
skip_memory_limit = true
skip_cpu_limit = true
description = "NES and SNES emulation"
required = false
install_type = "github_release"
install_scope = "portable"
asset_pattern = '^Mesen_[\d.]+_Windows\.zip$'
license = "GPL-3.0"
copyright = "Copyright 2014–2024 M. Bibeau and contributors"
source_url = "https://github.com/SourMesen/Mesen2"
supported_formats = [".nes", ".chd", ".sfc", ".smc", ".fig", ".swc", ".zip"]
guidance_text = "Download the Mesen Windows release and extract it to emulators/mesen/ so that Mesen.exe is inside."
guidance_url = "https://www.mesen.ca"

[[container_broker_files]]
path_key = "install_dir"
access = "rw"
mode = "grant"


[[container_broker_files]]
path_key = "saves_dir"
access = "rw"
mode = "grant"

[[dependencies]]
name = "mesen-fds-bios"
acquire_method = "user_supplied"
required = false
display_name = "Mesen FDS BIOS"
platform = "mesen"
bios_path = "emulators/mesen/data"
guidance_text = "Place disksys.rom in emulators/mesen/data/ to enable Famicom Disk System titles. Not required for standard NES/Famicom cartridge games."
guidance_url = "https://www.mesen.ca/docs/gettingstarted.html"
