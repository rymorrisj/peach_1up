slug = "flycast"
era = "dreamcast"
display_name = "Flycast"
name = "Flycast"
version = "v2.6"
binary = "flycast.exe"
download_url = "https://github.com/flyinghead/flycast"
portable_sentinel = "emu.cfg"
container_enabled = false
container_hardcap_disabled = true
container_hardcap_note = "Flycast can work with AppContainer in specific circumstances but is disabled for the current version for more testing."
skip_memory_limit = false
skip_cpu_limit = false
description = "Dreamcast emulation"
required = false
install_type = "github_release"
install_scope = "portable"
asset_pattern = '^flycast-win64-[\d.]+\.zip$'
license = "GPL-2.0"
copyright = "Copyright 2018–2024 The Flycast Team"
source_url = "https://github.com/flyinghead/flycast"
supported_formats = [".cdi", ".gdi", ".chd", ".cue"]
guidance_text = "Download the Flycast Windows release and extract it to emulators/flycast/ so that flycast.exe is inside."
guidance_url = "https://github.com/flyinghead/flycast"

[[container_broker_files]]
path_key = "install_dir"
access = "rw"
mode = "grant"


[[container_broker_files]]
path_key = "saves_dir"
access = "rw"
mode = "grant"

[[container_broker_files]]
path_key = "bios_dir"
access = "r"
mode = "grant"

[[dependencies]]
name = "dreamcast-bios"
acquire_method = "user_supplied"
required = true
display_name = "Dreamcast BIOS"
platform = "dreamcast"
bios_path = "emulators/flycast/data"
guidance_text = "Place dc_boot.bin and dc_flash.bin in emulators/flycast/data/. Both files must be from the same hardware revision."
guidance_url = "https://github.com/flyinghead/flycast"

[[known_limitations]]
title = "BIOS files must be from the same hardware revision"
severity = "warning"
description = "dc_boot.bin and dc_flash.bin must be from the same hardware revision. Mismatched pairs may cause region or boot failures."

[[known_limitations]]
title = "AppContainer isolation disabled"
severity = "info"
description = "Flycast can work with AppContainer in specific circumstances but is disabled for the current version for more testing. Job Object memory and CPU limits remain enabled."
