slug = "rpcs3"
era = "ps3"
display_name = "RPCS3"
name = "RPCS3"
version = "0.0.41"
binary = "rpcs3.exe"
download_url = "https://rpcs3.net/download"
release_url = "https://github.com/RPCS3/rpcs3-binaries-win/releases"
sandbox_mode = "appcontainer"
container_enabled = false
container_hardcap_disabled = true
container_permanently_excluded = true
capabilities = []
skip_memory_limit = true
skip_cpu_limit = true
description = "PlayStation 3 emulation"
required = false
install_type = "github_release"
install_scope = "portable"
asset_pattern = '^rpcs3-v[\d.]+-\d+-[0-9a-f]+_win64_msvc\.7z$'
license = "GPL-2.0"
copyright = "Copyright 2011-2024 the RPCS3 team and contributors"
source_url = "https://github.com/RPCS3/rpcs3-binaries-win"
supported_formats = [".iso", ".pkg"]
guidance_text = "RPCS3 is auto-installed from github.com/RPCS3/rpcs3-binaries-win, a companion binaries repo to the primary RPCS3/rpcs3 source repo, which has no downloadable releases of its own. Portable mode is automatic on Windows, no sentinel file is needed."
guidance_url = "https://rpcs3.net/quickstart"

[[container_broker_files]]
path_key = "install_dir"
access = "rw"
mode = "grant"

[[container_broker_files]]
path_key = "dev_hdd0"
access = "rw"
mode = "inherit"

[[container_broker_files]]
path_key = "dev_flash"
access = "rw"
mode = "inherit"

[[container_broker_files]]
path_key = "dev_bdvd"
access = "rw"
mode = "inherit"

[[dependencies]]
name = "ps3-firmware"
acquire_method = "user_supplied"
required = true
validation_type = "manual"
display_name = "PS3 Firmware (PS3UPDAT.PUP)"
platform = "ps3"
guidance_text = "Download the latest PS3 firmware (PS3UPDAT.PUP) from Sony and install it from within RPCS3 via File > Install Firmware, or pass --installfw at the command line. This populates dev_flash/ under RPCS3's portable data folder. Peach 1UP does not provide, link to, or assist with acquiring firmware files."
guidance_url = "https://rpcs3.net/quickstart"

[[known_limitations]]
title = "AppContainer isolation not supported"
severity = "critical"
description = "RPCS3 is a heavily JIT-based recompiler (Cell PPU/SPU and RSX) that relies on runtime code generation and low-level system calls incompatible with AppContainer's restricted token, the same class of limitation as xemu. Job Object isolation (kill-on-close, CPU cap) is the only available isolation layer on Windows."

[[known_limitations]]
title = "Controller input requires manual configuration"
severity = "info"
description = "RPCS3 does not auto-detect controllers. On first run, open Pads Settings inside RPCS3 and manually bind a gamepad, otherwise keyboard input is used by default."

[[known_limitations]]
title = "First-launch shader and JIT compilation stutter"
severity = "info"
description = "RPCS3 precompiles shaders and recompiles PPU/SPU code the first time a title is launched. Expect stutter and reduced performance on a title's first boot, subsequent launches are smoother once the caches are warm."

[[known_limitations]]
title = "Digital content (.pkg) installs need two launch attempts"
severity = "info"
description = "RPCS3 cannot install a .pkg headlessly (it refuses --installpkg combined with --no-gui) and never exits on its own once an unattended install finishes, so a single launch call cannot both install and boot within the coordinator's 30s dispatch window. The first launch of an uninstalled .pkg starts the install and returns once it stabilizes on disk (RPCS3 itself is terminated automatically, no manual dialog dismissal needed); launching the same title again afterward boots it normally from the resulting dev_hdd0/game/<TITLE_ID>/ folder."
