# Full vocabulary actually assignable to Environment.status: compute_live_status()
# returns healthy/degraded/unconfigured/error for non-system platforms and ok/missing
# for system platforms; the model field defaults to "unknown". See
# backend/service/environments/environments.py compute_live_status/_compute_status
# and EnvironmentHealthCounts (which only buckets 3 of these for aggregate counts).
environment_statuses:
  - "healthy"
  - "degraded"
  - "unconfigured"
  - "error"
  - "ok"
  - "missing"
  - "unknown"

era_backends:
  dos:       dosbox-x
  win95:     86box
  win98:     86box
  winxp:     86box
  ps1:       duckstation
  ps2:       pcsx2
  xbox:      xemu
  nes:       mesen
  snes:      mesen
  n64:       project64
  dreamcast: flycast

