name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.1"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate constants
        run: python scripts/gen_constants.py

      - name: Generate OpenAPI spec and types
        run: python scripts/export_and_build_types.py

      - name: Check generated files are up to date
        run: |
          git diff --exit-code -- \
            backend/constants_generated.py \
            frontend/src/generated/constants.ts \
            shared/openapi.json \
            shared/types.ts \
          || (echo "::error::Generated files are stale — run scripts/gen_constants.py and scripts/export_and_build_types.py locally and commit the result." && exit 1)

      - name: Upload generated files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-types
          retention-days: 7
          path: |
            backend/constants_generated.py
            frontend/src/generated/constants.ts
            shared/openapi.json
            shared/types.ts

  backend:
    needs: generate-types
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Download generated files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-types

      - name: Lint
        run: ruff check

      - name: Run pytest
        run: pytest --cov=backend --cov-report=term-missing

  frontend:
    needs: generate-types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.1"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download generated files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-types

      - name: Lint
        working-directory: frontend
        run: npx eslint .

      - name: Check formatting
        working-directory: frontend
        run: npx prettier --check .

      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build

      - name: Run vitest
        working-directory: frontend
        run: npx vitest run --coverage

  packaging-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.6"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (includes PyInstaller)
        run: pip install -r backend/requirements.txt

      - name: Stub frontend/docs build output
        shell: bash
        run: |
          set -e
          mkdir -p frontend/dist docs/build
          echo "<html></html>" > frontend/dist/index.html
          echo "<html></html>" > docs/build/index.html

      - name: Build with PyInstaller (spec validity check)
        run: pyinstaller --noconfirm --clean peach1up.spec

      - name: Assert packaged output exists and is a sane size
        shell: bash
        run: |
          set -e
          if [ ! -f dist/peach1up/peach1up.exe ]; then
            echo "::error::PyInstaller did not produce dist/peach1up/peach1up.exe"
            exit 1
          fi
          size_mb=$(du -sm dist/peach1up | cut -f1)
          echo "Packaged size: ${size_mb} MB"
          if [ "$size_mb" -gt 1500 ]; then
            echo "::error::dist/peach1up is ${size_mb} MB, over the 1500 MB smoke-test threshold — library/emulators assets may be leaking into the package"
            exit 1
          fi

      - name: Smoke-launch the packaged exe under frozen invocation
        shell: bash
        run: |
          set -e
          ./dist/peach1up/peach1up.exe &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/openapi.json -o /dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::Packaged exe never served /api/openapi.json within 30s under frozen invocation"
            exit 1
          fi
          echo "Backend served /api/openapi.json under frozen invocation"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.1"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run build
