name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generate-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate constants
        run: python scripts/gen_constants.py

      - name: Generate OpenAPI spec and types
        run: python scripts/export_and_build_types.py

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-types
          path: |
            backend/constants_generated.py
            frontend/src/generated/constants.ts
            shared/openapi.json
            shared/types.ts

  backend:
    needs: generate-types
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-types

      - name: Run pytest
        run: pytest --cov=backend --cov-report=term-missing

  frontend:
    needs: generate-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-types

      - name: Run vitest
        working-directory: frontend
        run: npx vitest run --coverage
