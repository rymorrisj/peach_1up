name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Provisional: matches the local .venv (3.14.6), not the 3.11 stated in README/CLAUDE.md — reconcile once docs are updated.
          python-version: "3.14.6"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest==9.1.1

      - name: Run pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run vitest
        working-directory: frontend
        run: npx vitest run
