name: Sandbox Release

# Triggered by pushing a sandbox-specific release tag (e.g. sandbox-v0.1.0),
# deliberately not the main app's v<version>-beta tag scheme (release.yml) -
# this package versions independently via
# backend/service/utils/platform/windows/pyproject.toml, not
# config/constants.yaml's app_version. The pushed tag's version must match
# that pyproject.toml's [project].version exactly, or the workflow fails
# before any build step runs, mirroring release.yml's own tag/version gate.
#
# This workflow is intentionally independent of release.yml: it does not
# build, sign, or publish the main Peach 1UP installer, and is not blocked on
# the code-signing certificate release.yml is waiting on (see DECISIONS.md).
# It only builds and publishes sandbox_host.exe for this one subsystem.
on:
  push:
    tags:
      - "sandbox-v*"

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 20
    # contents: write is scoped to this job only, to publish sandbox_host.exe
    # as a GitHub Release asset - the one thing this workflow needs beyond
    # the read-only default above.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read version from sandbox's pyproject.toml
        id: sandbox_version
        shell: pwsh
        run: |
          $content = Get-Content backend/service/utils/platform/windows/pyproject.toml -Raw
          if ($content -notmatch 'version\s*=\s*"([^"]+)"') {
            Write-Host "::error::Could not find [project].version in backend/service/utils/platform/windows/pyproject.toml"
            exit 1
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify tag matches pyproject.toml version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^sandbox-v(.+)$') {
            Write-Host "::error::Tag '$tag' does not match the expected sandbox-v<version> pattern"
            exit 1
          }
          $tagVersion = $Matches[1]
          $pyVersion = "${{ steps.sandbox_version.outputs.version }}"
          if ($tagVersion -ne $pyVersion) {
            Write-Host "::error::Tag '$tag' implies version '$tagVersion' but pyproject.toml version is '$pyVersion'. Update pyproject.toml or retag before releasing."
            exit 1
          }
          Write-Host "Tag '$tag' matches pyproject.toml version '$pyVersion' - proceeding with build."

      # windows-latest ships MSYS2 preinstalled at C:\msys64 but without the
      # gcc package build.sh's UCRT64 guard expects, and not on PATH.
      # release: false reuses that preinstalled MSYS2 in place, matching
      # release.yml's own MSYS2 setup step for the same reason.
      - name: Set up MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          release: false
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build sandbox_host.exe (MSYS2 UCRT64 g++)
        shell: msys2 {0}
        run: bash backend/service/utils/platform/windows/sandbox/build.sh

      - name: Assert sandbox_host.exe was produced
        shell: pwsh
        run: |
          $exe = "backend/service/utils/platform/windows/sandbox/sandbox_host.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::$exe not found after build.sh - the build must have failed silently."
            exit 1
          }
          Write-Host "Built: $exe"

      - name: Publish sandbox_host.exe to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "backend/service/utils/platform/windows/sandbox/sandbox_host.exe" `
            --repo "${{ github.repository }}" `
            --title "sandbox_host.exe ${{ github.ref_name }}" `
            --notes "Standalone build of sandbox_host.exe (Windows AppContainer + Job Object sandbox helper) for backend/service/utils/platform/windows/sandbox/. Unsigned. See that package's README.md for build/usage details." `
            --prerelease
