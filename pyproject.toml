[project]
name = "peach1up"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.8",
    "sqlmodel>=0.0.48",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=25.1.0",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "python-multipart>=0.0.33",
    "pycdlib>=1.22.0",
    "formatscout>=0.1.1",
    "wincage>=0.1.0",
    "httpx2>=2.16.0",
]

# Not distributed via PyPI or installed as an importable package (the app is
# invoked as `python -m uvicorn backend.main:app` / via peach1up_launcher.py,
# never `import peach1up`). package = false tells uv this is a dependency
# manifest for a venv, not a buildable project, so no [build-system] is needed.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]
build = ["pyinstaller>=6.22.3"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["backend"]

[tool.ruff.lint]
# Ruff's documented default selection, pinned explicitly so it doesn't drift
# with whatever a given Ruff version treats as its implicit default.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports symbols for the package's public API; the imports
# are intentionally "unused" within the file itself.
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/.venv/*",
]

[tool.coverage.report]
# Enforced when running: pytest --cov=backend --cov-report=term-missing
# Requires: uv sync --group dev (installs pytest-cov)
fail_under = 65
show_missing = true
skip_covered = false
