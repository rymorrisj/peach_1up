[project]
name = "peach1up"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.21",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "itsdangerous>=2.0.0",
    "argon2-cffi>=23.1.0",
    "pillow>=10.0.0",
    "pystray>=0.19.0",
    "python-multipart>=0.0.18",
    "pycdlib>=1.14.0",
    "formatscout",
    "wincage",
]

# Not distributed via PyPI or installed as an importable package (the app is
# invoked as `python -m uvicorn backend.main:app` / via peach1up_launcher.py,
# never `import peach1up`). package = false tells uv this is a dependency
# manifest for a venv, not a buildable project, so no [build-system] is needed.
[tool.uv]
package = false

# formatscout and wincage are vendored as local editable path dependencies,
# not pulled from PyPI. See services/vendor/{formatscout,wincage}/VENDORED_FROM.txt
# for source commit. formatscout's importable name matches its
# distribution name. wincage's does not yet, still importable as sandbox/
# sandbox_checker internally, see wincage's own pyproject.toml [tool.setuptools]
# packages field, a pending rename tracked separately.
[tool.uv.sources]
formatscout = { path = "services/vendor/formatscout", editable = true }
wincage = { path = "services/vendor/wincage", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.1"]
build = ["pyinstaller>=6.0.0"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["backend"]

[tool.ruff.lint]
# Ruff's documented default selection, pinned explicitly so it doesn't drift
# with whatever a given Ruff version treats as its implicit default.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports symbols for the package's public API; the imports
# are intentionally "unused" within the file itself.
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/.venv/*",
]

[tool.coverage.report]
# Enforced when running: pytest --cov=backend --cov-report=term-missing
# Requires: uv sync --group dev (installs pytest-cov)
fail_under = 65
show_missing = true
skip_covered = false