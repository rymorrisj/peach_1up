[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "win32-appcontainer-sandbox"
version = "0.1.0"
description = "Windows AppContainer + Job Object process sandbox, driven by a separate C++ helper process for crash-fault containment, plus a diagnostic capability-probe package."
readme = "sandbox/README.md"
# process.py (sandbox/) uses bare `str | None` / `SandboxConfig | None` union
# syntax in parameter annotations with no `from __future__ import annotations`
# guard, so those are evaluated eagerly at function-definition time and need
# native PEP 604 union support. No other file under either package goes past
# that: no match/case, no walrus, no other 3.11+/3.12+-only syntax found by
# grep across sandbox/ and sandbox_checker/.
requires-python = ">=3.10"
# Every import across sandbox/ and sandbox_checker/ (excluding tests) is
# either stdlib (ctypes, asyncio, pathlib, typing, dataclasses, enum,
# collections, json, os, subprocess, sys, threading) or a same-package
# relative import, confirmed by grepping every `^import `/`^from ` line in
# both packages. The one remaining non-stdlib import, `backend.core.logger`
# in job.py/process.py/sandbox.py/sandbox_process.py, is not a pip
# dependency (it's the monorepo's own logging shim) and is not resolvable
# outside the monorepo; it is the tracked extraction-readiness gap in
# sandbox/README.md's "Standalone-package intent" section, not a dependency
# to declare here.
dependencies = []

# This directory (platform/windows/) is the common parent of exactly the two
# packages that make up the extractable core: sandbox/ (including
# win32_types.py and sandbox_process.py, both already inside it) and
# sandbox_checker/. It also contains app_container.py and process/, the
# Peach 1UP-specific adapter layer that resolves eras.yaml/emulator-catalog/
# settings data before calling into sandbox/ (see sandbox/README.md's
# "Standalone-package intent" section); those are deliberately not listed
# below, this pyproject.toml packages only the generic core.
[tool.setuptools]
packages = ["sandbox", "sandbox_checker"]
